<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="IPTIRS development prototype for device-theft case coordination and evidence workflow design." />
    <meta name="robots" content="noindex, nofollow" />
    <title>IPTIRS — Development Prototype</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'brand-dark': '#1a202c',
              'brand-secondary': '#2d3748',
              'brand-light': '#4a5568',
              'brand-accent': '#3b82f6',
              'brand-text': '#e2e8f0',
              'brand-text-secondary': '#a0aec0',
            },
          },
        },
      }
    </script>
    <style>
      @media print {
        body::before {
          content: "IPTIRS — DEVELOPMENT REPORT (SAMPLE DATA ONLY)";
          display: block;
          text-align: center;
          font-weight: bold;
          font-size: 16pt;
          margin-bottom: 20px;
          border-bottom: 2px solid black;
          padding-bottom: 10px;
        }
        body::after {
          content: "DEMO ONLY — NOT AN OFFICIAL OR OPERATIONAL RECORD";
          display: block;
          text-align: center;
          font-size: 10pt;
          color: #666;
          margin-top: 30px;
          border-top: 1px solid #ccc;
          padding-top: 10px;
        }
        button, .no-print { display: none !important; }
      }
      .pdf-export-mode {
        background-color: white !important;
        color: black !important;
        padding: 20px !important;
      }
      .pdf-export-mode .bg-brand-secondary,
      .pdf-export-mode .bg-brand-dark {
        background-color: white !important;
        color: black !important;
        border: 1px solid #ccc !important;
        box-shadow: none !important;
      }
      .pdf-export-mode .text-white { color: black !important; }
      .pdf-export-mode .text-brand-text { color: #222 !important; }
      .pdf-export-mode .text-brand-text-secondary { color: #555 !important; }
      .pdf-export-mode .text-brand-accent { color: #0044cc !important; }
      .pdf-export-mode button { display: none !important; }
      .pdf-watermark { display: none; }
      .pdf-export-mode .pdf-watermark {
        display: block !important;
        text-align: center;
        margin-bottom: 20px;
        border-bottom: 2px solid #000;
        padding-bottom: 10px;
      }
    </style>
    <link rel="stylesheet" href="/index.css">
  </head>
  <body class="bg-brand-dark text-brand-text">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
